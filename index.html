<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雅思生词本</title>
  <style>
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e8eaf0; --muted: #9aa3b2;
      --accent: #7c8cf8; --accent-soft: #242a44; --green: #34d399;
      --green-soft: #16281d; --border: #2a2f3a; --shadow: 0 1px 2px rgba(0,0,0,.45);
      --star: #fbbf24; --star-off: #4a5262;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 76px; }
    header { background: var(--card); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 30; box-shadow: var(--shadow); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
    .head-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 0; }
    h1 { font-size: 19px; font-weight: 700; }
    nav { display: flex; gap: 6px; margin-left: auto; }
    .tab { border: 1px solid var(--border); background: var(--card); color: var(--muted);
      padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #10131a; font-weight: 600; }
    main { padding-top: 18px; }
    html.paged, body.paged { overflow: hidden; overscroll-behavior: none; }
    body.paged { height: 100vh; height: 100dvh; padding-bottom: 0; display: flex; flex-direction: column; }
    body.paged header { flex-shrink: 0; }
    body.paged main { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding-top: 12px; padding-bottom: calc(var(--pager-height, 64px) + 12px); }
    #simplePanel, #sentPanel { touch-action: pinch-zoom; }
    body.paged #simplePanel, body.paged #sentPanel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    body.paged .hint { flex-shrink: 0; }
    #grid, #sentList { flex: 1; min-height: 0; }
    body.paged .word-page { grid-template-columns: repeat(var(--word-columns, 3), minmax(0, 1fr));
      grid-template-rows: repeat(var(--word-rows, 1), minmax(0, 1fr)); }
    .word-page .cell { min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
    .word-page .w { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .sentence-page { display: grid; gap: 10px; grid-auto-rows: 112px; align-content: start; }
    .sent-preview { position: relative; height: 112px; min-width: 0; overflow: hidden;
      background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 20px; text-align: left; font: inherit; cursor: pointer; box-shadow: var(--shadow); }
    .sent-preview .orig { font-size: 15px; font-weight: 600; line-height: 1.55; max-height: 69.75px; overflow: hidden; }
    .sent-preview.truncated .orig { -webkit-mask-image: linear-gradient(#000 55%, transparent);
      mask-image: linear-gradient(#000 55%, transparent); }
    .sent-preview.truncated::after { content: ""; position: absolute; left: 20px; right: 20px;
      bottom: 24px; height: 20px; backdrop-filter: blur(1.5px); pointer-events: none;
      -webkit-mask-image: linear-gradient(transparent, #000); mask-image: linear-gradient(transparent, #000); }
    .sent-preview:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
    .modal { overscroll-behavior: contain; touch-action: pan-y pinch-zoom; }
    .modal .sent { padding: 0; margin: 0; border: 0; box-shadow: none; }
    .page-ghost { position: fixed; pointer-events: none; z-index: 24; overflow: hidden;
      background: var(--bg); box-shadow: 0 14px 32px rgba(0,0,0,.25); border-radius: 12px; }

    .hint { font-size: 12px; color: var(--muted); margin: 2px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
    .cell { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 8px 8px; cursor: pointer; text-align: center; user-select: none;
      transition: transform .06s ease, box-shadow .12s ease; box-shadow: var(--shadow); }
    .cell:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.45); }
    .cell .w { font-size: 14px; font-weight: 600; word-break: break-word; line-height: 1.25; }
    .cell .stars { font-size: 9px; letter-spacing: 1px; color: var(--star); margin-top: 5px;
      white-space: nowrap; }
    .cell .stars .off { color: var(--star-off); }
    .cell.archived { background: #12151a; border-color: #242933; opacity: .62; }
    .cell.archived .w { color: #6b7280; }
    .cell.archived:hover { transform: none; box-shadow: var(--shadow); }
    .cell.locked { cursor: not-allowed; }
    #grid .cell, #searchMain .cell { -webkit-touch-callout: none; -webkit-user-select: none; }

    .search-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; position: sticky;
      top: 64px; background: var(--bg); padding: 8px 0; z-index: 20; }
    .search-bar input { flex: 1; max-width: 420px; border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 12px; font-size: 14px; outline: none; background: var(--card); color: var(--text); }
    .search-bar input:focus { border-color: var(--accent); }

    .search-layout { display: flex; gap: 14px; align-items: flex-start; }
    .search-main { flex: 1; min-width: 0; }
    .alpha { position: sticky; top: 120px; display: flex; flex-direction: column; gap: 1px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px 3px; }
    .alpha button { border: none; background: none; color: var(--muted); font-size: 11px; cursor: pointer;
      width: 24px; height: 20px; border-radius: 5px; }
    .alpha button:hover { background: var(--accent-soft); color: var(--accent); }
    .group { margin-bottom: 18px; }
    .group h2 { font-size: 14px; color: var(--accent); margin: 0 0 8px 2px; }

    .empty { color: var(--muted); text-align: center; padding: 56px 0; font-size: 14px; }

    .pager { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -3px 12px rgba(0,0,0,.35); }
    .pager-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .pager-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
      border-radius: 999px; background: var(--border); outline: none; cursor: pointer; }
    .pager-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; border: 2px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,.4); cursor: pointer; }
    .pager-slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%;
      background: #fff; border: 2px solid var(--accent); cursor: pointer; }
    .pager-input { display: flex; align-items: center; gap: 6px; font-size: 13px;
      color: var(--muted); white-space: nowrap; }
    .pager-input input { width: 58px; text-align: center; background: var(--bg);
      color: var(--text); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 8px; font-size: 14px; outline: none; }
    .pager-input input:focus { border-color: var(--accent); }

    .sent { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 14px; }
    .sent .orig { font-size: 15px; font-weight: 600; line-height: 1.55; }
    .sent .trans { margin-top: 8px; color: var(--muted); font-size: 14px; }
    .sent h4 { font-size: 11px; color: var(--accent); margin: 13px 0 4px; text-transform: uppercase;
      letter-spacing: .5px; }
    .sent .main { font-size: 13px; color: var(--text); }
    .sent ul { padding-left: 20px; font-size: 13px; color: var(--muted); }
    .sent li { margin: 3px 0; }

    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.58); z-index: 50;
      display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-mask.show { display: flex; }
    .modal { background: var(--card); border-radius: 16px; max-width: 520px; width: 100%;
      max-height: 88vh; overflow: auto; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
    .modal .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .modal .mw { font-size: 24px; font-weight: 800; }
    .modal .mp { color: var(--muted); font-size: 15px; }
    .modal .tag { display: inline-block; background: var(--accent-soft); color: var(--accent);
      border-radius: 6px; padding: 1px 8px; font-size: 12px; }
    .modal .phrase { background: #2a2014; border: 1px solid #5c441f; color: #fbbf7b;
      border-radius: 10px; padding: 8px 12px; margin-top: 10px; font-size: 14px; }
    .modal h4 { font-size: 11px; color: var(--muted); margin: 14px 0 3px; text-transform: uppercase;
      letter-spacing: .5px; }
    .modal .en { color: var(--accent); font-style: italic; font-size: 14px; }
    .modal .def-en { font-size: 18px; font-weight: 600; font-style: normal; }
    .modal .cn { color: var(--muted); font-size: 13px; }
    .expand-btn { display: inline-block; border: 1px solid var(--border); background: var(--bg);
      color: var(--muted); border-radius: 999px; padding: 1px 10px; font-size: 11px;
      cursor: pointer; margin-left: 6px; vertical-align: middle; }
    .expand-btn:hover { color: var(--accent); border-color: var(--accent); }
    .chip { display: inline-block; background: var(--green-soft); color: var(--green);
      border-radius: 999px; padding: 1px 8px; font-size: 12px; margin: 2px 3px 2px 0; }
    .star-picker { display: flex; gap: 4px; margin-top: 14px; align-items: center; }
    .star-picker button { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--star-off); }
    .star-picker button.on { color: var(--star); }
    .star-picker .lab { font-size: 12px; color: var(--muted); margin-right: 4px; }
    .modal .actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn { flex: 1; border: 1px solid var(--border); background: var(--card); border-radius: 10px;
      padding: 10px 0; cursor: pointer; font-size: 14px; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #06230f; }
    .btn.ghost { background: var(--card); color: var(--muted); }
    .modal-close { float: right; border: none; background: none; font-size: 22px; color: var(--muted);
      cursor: pointer; line-height: 1; }

    .ctx { position: fixed; z-index: 60; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.16); padding: 5px; display: none; }
    .ctx button { display: block; width: 100%; border: none; background: none; text-align: left;
      padding: 8px 14px; font-size: 13px; cursor: pointer; border-radius: 6px; color: var(--text); }
    .ctx button:hover { background: var(--accent-soft); }
    @media (max-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 380px) { .tab { padding: 6px 10px; } nav { gap: 4px; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap head-row">
      <h1>📖 雅思生词本</h1>
      <nav>
        <button class="tab active" data-mode="memorize">记忆模式</button>
        <button class="tab" data-mode="review">复习模式</button>
        <button class="tab" data-mode="search">检索模式</button>
        <button class="tab" data-mode="sentences">长难句</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="search-bar" id="searchBar" style="display:none;">
      <input id="searchInput" type="text" placeholder="输入单词进行检索…" />
    </div>
    <div class="search-layout" id="searchLayout" style="display:none;">
      <div class="search-main" id="searchMain"></div>
      <div class="alpha" id="alpha"></div>
    </div>
    <div id="simplePanel">
      <div class="hint" id="modeHint"></div>
      <div class="grid word-page" id="grid"></div>
    </div>
    <div id="sentPanel" style="display:none;">
      <div class="hint">最新收录在前 · 点击句子查看全文、翻译与解析</div>
      <div id="sentList" class="sentence-page"></div>
    </div>
    <div class="pager" id="pager" style="display:none;">
      <div class="pager-inner">
        <input type="range" id="pageSlider" class="pager-slider" min="1" max="1" value="1" step="1" aria-label="翻页进度条" />
        <div class="pager-input">
          <input id="pageInput" type="number" min="1" max="1" value="1" inputmode="numeric" />
          <span id="pagerTotal">/ 1</span>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-mask" id="mask">
    <div class="modal" id="modal"></div>
  </div>
  <div class="ctx" id="ctx">
    <button id="ctxUnarchive">移回学习中（未背）</button>
    <button id="ctxDelete" style="color:#f87171;">删除该单词</button>
  </div>

  <script src="data.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script>
    // 手机/托管环境下注册 service worker，让词库更新即时生效；本地双击 file:// 时跳过
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <script>
    const DATA = window.IELTS_DATA;
    const LS_KEY = "ielts_state_v1";
    const LS_DEL = "ielts_deleted_v1";
    const LS_TS = "ielts_ts_v1";
    let mode = "memorize";
    let query = "";
    let ctxWord = null;
    let page = 1;
    let wordPageSize = 27;
    let sentencePageSize = 1;
    let focusedWord = null;
    let focusedSentence = null;
    const modePositions = {};
    let pageAnimations = [];
    let pageGhost = null;

    function clearPageAnimation() {
      pageAnimations.forEach(a => a.cancel());
      pageAnimations = [];
      if (pageGhost) pageGhost.remove();
      pageGhost = null;
    }

    function totalPages() {
      const count = mode === "sentences" ? DATA.sentences.length : sortedVocab().length;
      return Math.max(1, Math.ceil(count / (mode === "sentences" ? sentencePageSize : wordPageSize)));
    }

    function fitPage(preservePosition = true) {
      if (mode === "search") return;
      const isSent = mode === "sentences";
      const list = isSent ? DATA.sentences.slice().reverse() : sortedVocab();
      const oldSize = isSent ? sentencePageSize : wordPageSize;
      const focused = isSent ? focusedSentence : focusedWord;
      let anchor = preservePosition && focused != null
        ? list.findIndex(v => (isSent ? v.id : v.word) === focused) : -1;
      if (anchor < 0) anchor = (page - 1) * oldSize;
      const pager = document.getElementById("pager");
      document.body.style.setProperty("--pager-height", (pager.getBoundingClientRect().height || 60) + "px");
      const box = document.getElementById(isSent ? "sentList" : "grid");
      const { width, height } = box.getBoundingClientRect();
      if (isSent) sentencePageSize = Math.max(1, Math.floor((height + 10) / 122));
      else {
        const columns = Math.max(1, Math.floor((width + 10) / (window.innerWidth <= 560 ? 100 : 128)));
        const rows = Math.max(1, Math.floor((height + 10) / 86));
        wordPageSize = columns * rows;
        box.style.setProperty("--word-columns", columns);
        box.style.setProperty("--word-rows", rows);
      }
      const size = isSent ? sentencePageSize : wordPageSize;
      if (preservePosition) page = Math.floor(anchor / size) + 1;
      page = Math.min(Math.max(1, page), totalPages());
    }

    function goToPage(value) {
      if (mode === "search") return;
      cancelLongPress();
      hideWordMenu();
      const next = Math.min(totalPages(), Math.max(1, Math.trunc(Number(value)) || page));
      if (next === page) { updatePager(page, totalPages()); return; }
      clearPageAnimation();
      const panel = document.getElementById(mode === "sentences" ? "sentList" : "grid");
      const direction = next > page ? -1 : 1;
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduced && panel.animate) {
        const rect = panel.getBoundingClientRect();
        pageGhost = panel.cloneNode(true);
        pageGhost.removeAttribute("id");
        pageGhost.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
        pageGhost.setAttribute("aria-hidden", "true");
        pageGhost.classList.add("page-ghost");
        Object.assign(pageGhost.style, { left: rect.left + "px", top: rect.top + "px",
          width: rect.width + "px", height: rect.height + "px" });
        document.body.appendChild(pageGhost);
      }
      page = next;
      focusedWord = null; focusedSentence = null;
      if (mode === "sentences") renderSentences(); else renderSimple();
      window.scrollTo({ top: 0, behavior: "instant" });
      if (pageGhost) {
        const outgoing = pageGhost.animate([
          { transform: "translateX(0) scale(1)", opacity: 1 },
          { transform: `translateX(${direction * 90}px) scale(.96)`, opacity: 0 }
        ], { duration: 240, easing: "ease-in", fill: "forwards" });
        const incoming = panel.animate([
          { transform: `translateX(${-direction * 24}px) scale(.96)`, opacity: .25 },
          { transform: "translateX(0) scale(1)", opacity: 1 }
        ], { duration: 300, easing: "cubic-bezier(.2,.7,.2,1)" });
        pageAnimations = [outgoing, incoming];
        incoming.onfinish = clearPageAnimation;
      }
    }

    function nowMs() { return Date.now(); }

    function loadState() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) {}
      DATA.vocab.forEach(v => {
        if (!saved[v.word]) saved[v.word] = { stars: v.stars || 0, archived: !!v.archived };
      });
      return saved;
    }
    let state = loadState();
    let deleted = new Set(JSON.parse(localStorage.getItem(LS_DEL) || "[]"));
    let tsMap = {};
    try { tsMap = JSON.parse(localStorage.getItem(LS_TS) || "{}"); } catch (e) {}

    function persistLocal() {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      localStorage.setItem(LS_DEL, JSON.stringify([...deleted]));
      localStorage.setItem(LS_TS, JSON.stringify(tsMap));
    }

    function commit(word, patch) {
      const cur = state[word] || { stars: 0, archived: false };
      const next = Object.assign({}, cur, patch);
      state[word] = next;
      if (patch.deleted === true) deleted.add(word);
      else if (patch.deleted === false) deleted.delete(word);
      const t = nowMs();
      tsMap[word] = t;
      persistLocal();
      VocabSync.push(word, next.stars || 0, !!next.archived, deleted.has(word), t);
    }

    function getSt(word) { return state[word] || { stars: 0, archived: false }; }
    function withState(v) { return Object.assign({}, v, getSt(v.word)); }

    async function initSync() {
      const ok = await VocabSync.init();
      if (!ok) return;
      const remote = await VocabSync.fetchAll();
      if (!remote) return;
      const words = new Set([...DATA.vocab.map(v => v.word), ...Object.keys(remote), ...Object.keys(state)]);
      for (const w of words) {
        const r = remote[w];
        const local = state[w] || { stars: 0, archived: false };
        const localDeleted = deleted.has(w);
        const localTs = tsMap[w] || 0;
        const rTs = r && r.updated_at ? new Date(r.updated_at).getTime() : 0;
        const localEdited = localTs > 0 || (local.stars || 0) > 0 || local.archived || localDeleted;
        if (!r) {
          if (localEdited) {
            const t = localTs || nowMs();
            VocabSync.push(w, local.stars || 0, !!local.archived, localDeleted, t);
            tsMap[w] = t;
          }
        } else if (!localEdited || rTs >= localTs) {
          state[w] = { stars: r.stars || 0, archived: !!r.archived };
          if (r.deleted) deleted.add(w); else deleted.delete(w);
          tsMap[w] = rTs;
        } else {
          VocabSync.push(w, local.stars || 0, !!local.archived, localDeleted, localTs);
        }
      }
      persistLocal();
      render();
    }

    function starIcons(n, off) {
      let s = "";
      for (let i = 1; i <= 5; i++) s += i <= n ? "★" : "<span class='off'>★</span>";
      return s;
    }

    function sortedVocab() {
      const vs = DATA.vocab.map(withState).filter(v => !deleted.has(v.word));
      if (mode === "memorize") return vs.slice().sort((a, b) => a.order - b.order);
      if (mode === "review")
        return vs.filter(v => v.archived)
          .sort((a, b) => b.stars - a.stars || a.word.localeCompare(b.word));
      const q = query.trim().toLowerCase();
      return vs.filter(v => !q || v.word.toLowerCase().includes(q))
        .sort((a, b) => a.word.localeCompare(b.word));
    }

    function cellHtml(v, locked) {
      const cls = "cell" + (locked ? " archived locked" : "");
      return `<div class="${cls}" data-word="${v.word}">
        <div class="w">${v.word}</div>
        <div class="stars">${starIcons(v.stars)}</div>
      </div>`;
    }

    function renderSimple() {
      const grid = document.getElementById("grid");
      const hint = document.getElementById("modeHint");
      const list = sortedVocab();
      hint.textContent = mode === "memorize"
        ? "按学习时间顺序排列 · 灰色为已背单词（不可查看） · 点击卡片查看详情"
        : "已背单词 · 按星级从高到低排列，同星级按字母顺序 · 点击可查看或调整星级";
      const totalPages = Math.max(1, Math.ceil(list.length / wordPageSize));
      if (page < 1) page = 1;
      if (page > totalPages) page = totalPages;
      if (!list.length) {
        grid.innerHTML = '<div class="empty">这里还没有单词。</div>';
        setPagerVisible(false);
        return;
      }
      setPagerVisible(true);
      const start = (page - 1) * wordPageSize;
      grid.innerHTML = list.slice(start, start + wordPageSize)
        .map(v => cellHtml(v, mode === "memorize" && v.archived)).join("");
      updatePager(page, totalPages);
    }

    function setPagerVisible(show) {
      document.getElementById("pager").style.display = show ? "" : "none";
    }

    function updatePager(cur, total) {
      const slider = document.getElementById("pageSlider");
      const input = document.getElementById("pageInput");
      const totalEl = document.getElementById("pagerTotal");
      slider.max = total;
      slider.value = cur;
      const pct = total <= 1 ? 100 : ((cur - 1) / (total - 1)) * 100;
      slider.style.background = "linear-gradient(to right, var(--accent) " + pct + "%, var(--border) " + pct + "%)";
      input.max = total;
      input.value = cur;
      totalEl.textContent = "/ " + total;
    }

    function renderSearch() {
      const main = document.getElementById("searchMain");
      const alpha = document.getElementById("alpha");
      const list = sortedVocab();
      if (!list.length) { main.innerHTML = '<div class="empty">没有匹配的单词。</div>'; alpha.innerHTML = ""; return; }
      const groups = {};
      list.forEach(v => {
        const k = /^[a-zA-Z]/.test(v.word) ? v.word[0].toUpperCase() : "#";
        (groups[k] = groups[k] || []).push(v);
      });
      main.innerHTML = Object.keys(groups).sort((a, b) =>
        (a === "#" ? 1 : b === "#" ? -1 : a.localeCompare(b))).map(k =>
        `<div class="group" id="grp-${k}"><h2>${k}</h2>
          <div class="grid">${groups[k].map(v => cellHtml(v, false)).join("")}</div></div>`).join("");
      alpha.innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(c =>
        `<button data-letter="${c}">${c}</button>`).join("");
    }

    function render() {
      cancelLongPress();
      clearPageAnimation();
      const isSearch = mode === "search";
      const isSent = mode === "sentences";
      document.documentElement.classList.toggle("paged", !isSearch);
      document.body.classList.toggle("paged", !isSearch);
      document.getElementById("searchBar").style.display = isSearch ? "" : "none";
      document.getElementById("searchLayout").style.display = isSearch ? "" : "none";
      document.getElementById("simplePanel").style.display = (isSearch || isSent) ? "none" : "";
      document.getElementById("sentPanel").style.display = isSent ? "" : "none";
      setPagerVisible(!isSearch);
      fitPage();
      document.querySelectorAll(".tab").forEach(t =>
        t.classList.toggle("active", t.dataset.mode === mode));
      if (isSearch) renderSearch();
      else if (isSent) renderSentences();
      else renderSimple();
    }

    function renderSentences() {
      const box = document.getElementById("sentList");
      if (!DATA.sentences.length) {
        box.innerHTML = '<div class="empty">还没有长难句。</div>';
        setPagerVisible(false); return;
      }
      page = Math.min(Math.max(1, page), totalPages());
      setPagerVisible(true);
      updatePager(page, totalPages());
      const start = (page - 1) * sentencePageSize;
      box.innerHTML = DATA.sentences.slice().reverse().slice(start, start + sentencePageSize).map(s => `
        <button class="sent-preview" data-sentence="${s.id}" aria-label="查看长难句全文、翻译与解析">
          <div class="orig">${s.original}</div>
        </button>`).join("");
      box.querySelectorAll(".sent-preview").forEach(card => {
        const text = card.querySelector(".orig");
        card.classList.toggle("truncated", text.scrollHeight > text.clientHeight + 1);
      });
    }

    function openSentence(id) {
      const s = DATA.sentences.find(item => String(item.id) === String(id));
      if (!s) return;
      focusedSentence = s.id;
      const modal = document.getElementById("modal");
      delete modal.dataset.word;
      modal.innerHTML = `<button class="modal-close" id="closeBtn" aria-label="关闭">×</button>
        <div class="sent"><h4>长难句原文</h4><div class="orig">${s.original}</div>
        <h4>中文翻译</h4><div class="trans">${s.translation}</div>
        <h4>结构简析</h4><div class="main">${s.main}</div>
        <ul>${s.clauses.map(c => `<li>${c}</li>`).join("")}</ul></div>`;
      document.getElementById("mask").classList.add("show");
      modal.scrollTop = 0;
      document.getElementById("closeBtn").onclick = closeModal;
    }

    function openModal(word) {
      focusedWord = word;
      const v = withState(DATA.vocab.find(x => x.word === word));
      const modal = document.getElementById("modal");
      modal.innerHTML = `
        <button class="modal-close" id="closeBtn">×</button>
        <div class="head"><span class="mw">${v.word}</span><span class="mp">${v.phonetic}</span>
          <span class="tag">${v.pos}</span></div>
        ${v.phrase ? `<div class="phrase">📎 常用短语：<b>${v.phrase}</b></div>` : ""}
        <h4>英文释义</h4><div class="en def-en">${v.defEn}</div>
        <h4>中文释义 <button class="expand-btn" id="expandCn">展开</button></h4>
        <div id="cnMeanings" style="display:none;">${v.meanings.join("；")}</div>
        <h4>用法</h4><div>${v.usage}</div>
        <h4>例句</h4><div class="en">${v.example}</div><div class="cn">${v.exampleCn}</div>
        <h4>词根词缀</h4>
        ${v.prefix ? `<div><b>前缀</b>：${v.prefix}</div>` : ""}
        <div><b>词根</b>：${v.root}</div>
        ${v.suffix ? `<div><b>后缀</b>：${v.suffix}</div>` : ""}
        ${v.synonyms.length ? `<h4>近义词</h4><div>${v.synonyms.map(s => `<span class="chip">${s}</span>`).join("")}</div>` : ""}
        ${v.derivatives.length ? `<h4>衍生词</h4><div>${v.derivatives.join("；")}</div>` : ""}
        <div class="star-picker">
          <span class="lab">我的星级：</span>
          ${[1,2,3,4,5].map(i => `<button data-star="${i}" class="${i <= v.stars ? 'on' : ''}">★</button>`).join("")}
          <span style="font-size:12px;color:var(--muted)">${v.stars} 星（点同一颗星可清零）</span>
        </div>
        ${(mode === "memorize" && !v.archived)
          ? `<div class="actions"><button class="btn primary" id="actDone">归档到已背</button></div>`
          : ""}`;
      document.getElementById("mask").classList.add("show");
      modal.scrollTop = 0;
      modal.dataset.word = word;

      document.getElementById("closeBtn").onclick = closeModal;
      const cnBtn = document.getElementById("expandCn");
      const cnBox = document.getElementById("cnMeanings");
      if (cnBtn && cnBox) cnBtn.onclick = () => {
        const hidden = cnBox.style.display === "none";
        cnBox.style.display = hidden ? "" : "none";
        cnBtn.textContent = hidden ? "收起" : "展开";
      };
      modal.querySelectorAll(".star-picker button").forEach(b => b.onclick = () => {
        const n = +b.dataset.star;
        const cur = getSt(word).stars;
        commit(word, { stars: (cur === n) ? 0 : n });
        render(); openModal(word);
      });
      const done = document.getElementById("actDone");
      if (done) done.onclick = () => { commit(word, { archived: true }); closeModal(); };
    }
    function closeModal() {
      document.getElementById("mask").classList.remove("show");
      render();
    }

    document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
      if (mode === t.dataset.mode) return;
      if (mode !== "search") {
        const isSent = mode === "sentences";
        const size = isSent ? sentencePageSize : wordPageSize;
        const list = isSent ? DATA.sentences.slice().reverse() : sortedVocab();
        const first = list[(page - 1) * size];
        modePositions[mode] = { page, size, anchor: first ? (isSent ? first.id : first.word) : null };
      }
      hideWordMenu();
      mode = t.dataset.mode;
      const saved = modePositions[mode];
      page = saved ? saved.page : 1;
      focusedWord = null; focusedSentence = null;
      if (saved) {
        if (mode === "sentences") { sentencePageSize = saved.size; focusedSentence = saved.anchor; }
        else { wordPageSize = saved.size; focusedWord = saved.anchor; }
      }
      window.scrollTo(0, 0); render();
    }));

    document.getElementById("grid").addEventListener("click", e => {
      const cell = e.target.closest(".cell");
      if (!cell) return;
      const word = cell.dataset.word;
      const v = withState(DATA.vocab.find(x => x.word === word));
      if (mode === "memorize" && v.archived) return;   // 已背不可查看
      openModal(word);
    });
    document.getElementById("sentList").addEventListener("click", e => {
      const card = e.target.closest(".sent-preview");
      if (card) openSentence(card.dataset.sentence);
    });

    document.getElementById("searchMain").addEventListener("click", e => {
      const cell = e.target.closest(".cell");
      if (cell) openModal(cell.dataset.word);
    });
    document.getElementById("alpha").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      const el = document.getElementById("grp-" + b.dataset.letter);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    document.getElementById("searchInput").addEventListener("input", e => {
      query = e.target.value; renderSearch();
    });

    document.getElementById("pageSlider").addEventListener("input", e => {
      goToPage(e.target.value);
    });
    document.getElementById("pageInput").addEventListener("change", e => {
      goToPage(e.target.value);
    });
    document.getElementById("pageInput").addEventListener("keydown", e => {
      if (e.key === "Enter") e.target.blur();
    });

    let swipe = null;
    let suppressClickUntil = 0;
    let longPress = null;
    let longPressTimer = null;
    let longPressOpened = false;
    function cancelLongPress() {
      clearTimeout(longPressTimer);
      longPressTimer = null;
      longPress = null;
    }
    function hideWordMenu() {
      document.getElementById("ctx").style.display = "none";
      ctxWord = null;
    }
    function menuCell(target) {
      if (mode !== "search" && mode !== "memorize") return null;
      const cell = target.closest(mode === "search" ? "#searchMain .cell" : "#grid .cell");
      return cell && !document.getElementById("mask").classList.contains("show") ? cell : null;
    }
    function showWordMenu(cell, x, y) {
      ctxWord = cell.dataset.word;
      document.getElementById("ctxUnarchive").style.display = getSt(ctxWord).archived ? "" : "none";
      const ctx = document.getElementById("ctx");
      ctx.style.display = "block";
      const rect = ctx.getBoundingClientRect();
      ctx.style.left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8)) + "px";
      ctx.style.top = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8)) + "px";
    }
    const swipeBlocked = target => mode === "search" ||
      document.getElementById("mask").classList.contains("show") ||
      !!target.closest("input, button:not(.sent-preview), a, textarea, select, #pager, #ctx, .modal-mask");
    document.addEventListener("touchstart", e => {
      cancelLongPress();
      longPressOpened = false;
      swipe = null;
      if (e.touches.length === 1) {
        const cell = menuCell(e.target);
        if (cell) {
          const { clientX: x, clientY: y } = e.touches[0];
          longPress = { x, y };
          longPressTimer = setTimeout(() => {
            cancelLongPress();
            swipe = null;
            longPressOpened = true;
            showWordMenu(cell, x, y);
          }, 500);
        }
      }
      if (e.touches.length !== 1 || swipeBlocked(e.target)) return;
      const t = e.touches[0];
      swipe = { x: t.clientX, y: t.clientY, time: Date.now(), mode, axis: null };
    }, { passive: true });
    document.addEventListener("touchmove", e => {
      if (longPress && (e.touches.length !== 1 ||
        Math.hypot(e.touches[0].clientX - longPress.x, e.touches[0].clientY - longPress.y) > 10)) cancelLongPress();
      if (!swipe) return;
      if (e.touches.length !== 1) { swipe = null; return; }
      const dx = Math.abs(e.touches[0].clientX - swipe.x), dy = Math.abs(e.touches[0].clientY - swipe.y);
      if (!swipe.axis && Math.max(dx, dy) > 12) swipe.axis = dx > dy * 1.3 ? "x" : "y";
    }, { passive: true });
    document.addEventListener("touchcancel", () => {
      cancelLongPress(); swipe = null;
      if (longPressOpened) suppressClickUntil = Date.now() + 400;
      longPressOpened = false;
    }, { passive: true });
    document.addEventListener("touchend", e => {
      cancelLongPress();
      if (longPressOpened) {
        suppressClickUntil = Date.now() + 400;
        longPressOpened = false;
        swipe = null;
        return;
      }
      const start = swipe;
      swipe = null;
      if (!start || start.axis === "y" || !e.changedTouches.length || start.mode !== mode || swipeBlocked(e.target)) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - start.x, dy = t.clientY - start.y;
      if (Date.now() - start.time > 900 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      suppressClickUntil = Date.now() + 400;
      goToPage(page + (dx < 0 ? 1 : -1));
    }, { passive: true });
    document.addEventListener("click", e => {
      if (Date.now() < suppressClickUntil && !e.target.closest("#ctx")) { e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);

    // 记忆和检索模式：触屏长按或电脑右键。
    document.addEventListener("contextmenu", e => {
      const cell = menuCell(e.target);
      if (!cell) return;
      e.preventDefault();
      cancelLongPress(); swipe = null;
      if (e.pointerType === "touch" || longPressOpened) longPressOpened = true;
      showWordMenu(cell, e.clientX, e.clientY);
    });
    document.getElementById("ctxUnarchive").onclick = () => {
      if (ctxWord) { commit(ctxWord, { archived: false }); ctxWord = null; }
      document.getElementById("ctx").style.display = "none";
      render();
    };
    document.getElementById("ctxDelete").onclick = () => {
      if (ctxWord) {
        commit(ctxWord, { deleted: true });
        ctxWord = null;
      }
      document.getElementById("ctx").style.display = "none";
      render();
    };
    document.addEventListener("click", e => {
      if (!e.target.closest("#ctx")) hideWordMenu();
    });
    document.addEventListener("scroll", () => { cancelLongPress(); hideWordMenu(); }, { passive: true, capture: true });
    window.addEventListener("blur", () => { cancelLongPress(); hideWordMenu(); });
    document.getElementById("mask").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeModal();
    });

    let resizeFrame = 0;
    function scheduleFit() {
      cancelLongPress(); hideWordMenu();
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        if (mode !== "search") render();
      });
    }
    window.addEventListener("resize", scheduleFit);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleFit);
    const layoutObserver = new ResizeObserver(scheduleFit);
    layoutObserver.observe(document.querySelector("main"));
    layoutObserver.observe(document.querySelector("header"));
    layoutObserver.observe(document.getElementById("pager"));
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
    render();
    initSync();
  </script>
</body>
</html>
